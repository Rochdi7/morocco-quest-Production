<?php
// Set the deadline to March 22, 2025 at 23:59:59
$target_date = strtotime("March 22, 2025 23:59:59");

// Get the current server time
$current_time = time();

// Calculate remaining time in seconds
$remaining_time = max(0, $target_date - $current_time);
?>

        <div class="countdown">

            <div class="countdown-box" id="minutes">00</div>
        </div>
    </div>

    <script>
        // Get the exact remaining time from the server
        let remainingTime = <?php echo $remaining_time; ?>;

        function updateCountdown() {
            if (remainingTime <= 0) {
                clearInterval(timer);
                document.querySelector("h1").innerText = "We're Live!";
                document.querySelector(".countdown").style.display = "none";
                return;
            }

            let days = Math.floor(remainingTime / (60 * 60 * 24));
            let hours = Math.floor((remainingTime % (60 * 60 * 24)) / (60 * 60));
            let minutes = Math.floor((remainingTime % (60 * 60)) / 60);

            document.getElementById("days").innerText = days < 10 ? '0' + days : days;
            document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;

            remainingTime--; // Reduce time by 1 second
        }

        // Immediately update countdown on page load
        updateCountdown();

        // Ensure countdown updates every second correctly
        let timer = setInterval(updateCountdown, 1000);
    </script>
